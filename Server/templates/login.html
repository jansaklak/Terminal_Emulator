<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie – Panel Administratora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --muted-color: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-color: #94a3b8;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --danger-color: #f87171;
            --danger-bg: #450a0a;
            --danger-border: #7f1d1d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .login-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .login-header p {
            font-size: 13px;
            color: var(--muted-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .form-group input {
            width: 100%;
            padding: 9px 12px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 10px 16px;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .error-alert {
            display: none;
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-color);
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--muted-color);
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .theme-toggle:hover {
            color: var(--text-color);
            border-color: var(--text-color);
        }
    </style>
</head>

<body>

    <button type="button" class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">Ciemny motyw</button>

    <div class="login-card">
        <div class="login-header">
            <h1>Panel Administratora</h1>
            <p>Wprowadź poświadczenia, aby uzyskać dostęp</p>
        </div>

        <div id="errorAlert" class="error-alert"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Login administratora</label>
                <input id="username" type="text" placeholder="admin" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Hasło</label>
                <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Zaloguj się</button>
        </form>
    </div>

    <script>
        function applyTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggleBtn').textContent = 'Jasny motyw';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeToggleBtn').textContent = 'Ciemny motyw';
            }
        }

        function toggleTheme() {
            const isDark = !document.body.classList.contains('dark-mode');
            localStorage.setItem('admin_theme_dark', isDark ? 'true' : 'false');
            applyTheme(isDark);
        }

        const savedTheme = localStorage.getItem('admin_theme_dark');
        if (savedTheme === 'true' || (savedTheme === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            applyTheme(true);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const errBox = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');
            errBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Weryfikacja...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    window.location.href = '/';
                } else {
                    errBox.textContent = data.error || 'Nieprawidłowy login lub hasło';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = 'Błąd połączenia z serwerem';
                errBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Zaloguj się';
            }
        }
    </script>
</body>

</html>
